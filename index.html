<!doctype html>

<html lang="pt-br">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulários</title>
</head>

<body>

<header>
<h1>Contato</h1>
<p>Preencha esse formulario abaixo para falar com a gente!</p>
</header>

<hr>

<main>

<form action=""> 

<div> 

<label for="name">Nome</label>

<input type="text"
id="name"
name="nome"
required
placeholder="Digite seu nome"
>

</div>
 
<br>

<div>

<label for="email">Email</label>

<input type="email"
id="email"
name="email"
required
placeholder="exemplo@email.com"
>

</div>

<br>

<div>

    <label for="city">Cidade</label>

    <input type="text"
    name="Cidade"
    id="city"
    required
    placeholder="Digite sua Cidade"
    >
</div>

<br>

<button type="submit">Enviar</button>

</form>    

</main>

<hr>

<footer>
    <p><strong>Formulário feito por Paulo Ferri</strong></p>
</footer>

</body>

</html>
